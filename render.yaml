# Render blueprint (free web service). Data is stored in Turso, so the free
# plan's wiped filesystem does not matter. Fill the secret values in the
# Render dashboard when prompted.
services:
  - type: web
    name: aib-assessment
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TEACHER_SIGNUP_CODE
        sync: false
